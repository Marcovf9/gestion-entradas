services:
  - type: web
    name: entradas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false # jdbc:postgresql://host:5432/db (pegar desde el dashboard de Render)
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false # generar con: openssl rand -base64 64
      - key: ADMIN_DEFAULT_EMAIL
        sync: false # solo se usa la primera vez, si no existe ningún admin todavía
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false # cuenta de Gmail que envía las confirmaciones (opcional)
      - key: MAIL_PASSWORD
        sync: false # App Password de Gmail (opcional)
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://tu-sitio.netlify.app
