databases:
  - name: entradas-db
    databaseName: entradas
    user: entradas
    plan: free # cambiar si tu cuenta no tiene disponible el plan free de Postgres

services:
  - type: web
    name: entradas-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Host/puerto/nombre de la base se cablean solos desde entradas-db.
      # El usuario y la contraseña también, sin pegar nada a mano.
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: entradas-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: entradas-db
          property: port
      - key: SPRING_DATASOURCE_DBNAME
        fromDatabase:
          name: entradas-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: entradas-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: entradas-db
          property: password
      - key: JWT_SECRET
        sync: false # generar con: openssl rand -base64 64
      - key: ADMIN_DEFAULT_EMAIL
        sync: false # solo se usa la primera vez, si no existe ningún admin todavía
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false # cuenta de Gmail que envía las confirmaciones (opcional)
      - key: MAIL_PASSWORD
        sync: false # App Password de Gmail (opcional)
      - key: CORS_ALLOWED_ORIGINS
        value: https://entradas-frontend.onrender.com # si Render te asigna otro nombre al frontend, actualizar acá

  - type: web
    name: entradas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://entradas-backend.onrender.com/api # si Render te asigna otro nombre al backend, actualizar acá
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
