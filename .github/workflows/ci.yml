name: CI — Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:

  # -- Backend ------------------------------------------------------------
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: entradas
          POSTGRES_PASSWORD: entradas
          POSTGRES_DB: entradas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entradas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/entradas_test
          SPRING_DATASOURCE_USERNAME: entradas
          SPRING_DATASOURCE_PASSWORD: entradas
          JWT_SECRET: ci-secret-key-para-tests-no-usar-en-produccion
        run: ./mvnw verify -B

  # -- Frontend -------------------------------------------------------------
  frontend:
    name: Frontend (Node 20 + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  # -- Docker build check (solo en main) -------------------------------------
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend -t entradas-backend:ci
