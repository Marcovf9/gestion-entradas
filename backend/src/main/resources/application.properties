# -- Servidor --------------------------------------------------------------
server.port=${PORT:8080}

# -- Base de datos (PostgreSQL) ---------------------------------------------
# Si SPRING_DATASOURCE_URL viene seteada (dev local, o cualquier plataforma
# que entregue una URL completa) se usa tal cual. Si no, se arma a partir de
# HOST/PORT/DBNAME por separado — así el Blueprint de Render puede cablear
# la base con fromDatabase sin que haya que pegar ningún connection string
# a mano en el dashboard.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DBNAME:entradas}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -- JPA / Hibernate ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -- Flyway ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# -- JWT --------------------------------------------------------------------
jwt.secret=${JWT_SECRET:CAMBIAR_EN_PRODUCCION_GENERAR_CON_OPENSSL_rand_base64_64}

# -- Admin inicial (solo se usa si no existe ningún admin todavía) ----------
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:}

# -- Correo SMTP --------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -- CORS (separar múltiples orígenes con coma) ------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
