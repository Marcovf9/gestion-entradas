# Perfil de test: Postgres real (local o el que provea CI vía
# SPRING_DATASOURCE_URL), para que Flyway corra las migraciones de verdad y
# el locking pesimista / las restricciones de transacciones read-only se
# comporten exactamente igual que en producción.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/entradas_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

jwt.secret=test-secret-key-solo-para-tests-no-usar-en-produccion
