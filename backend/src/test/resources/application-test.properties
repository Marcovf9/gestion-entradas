# Perfil de test: H2 en memoria, sin Docker/Postgres real (por eso no se usa
# el dialecto Postgres: H2 no soporta el "for no key update" que Hibernate
# genera para PESSIMISTIC_WRITE contra PostgreSQLDialect). Igual sirve para
# validar la lógica de negocio y el locking a nivel de "SELECT ... FOR
# UPDATE". La validación real contra Postgres (incluidas las migraciones de
# Flyway) queda a cargo del job de CI, que sí tiene un Postgres real.
spring.datasource.url=jdbc:h2:mem:entradas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.secret=test-secret-key-solo-para-tests-no-usar-en-produccion
